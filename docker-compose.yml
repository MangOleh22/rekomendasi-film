services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekomfilm_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rekomendasi_film
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: rekomfilm_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rekomendasi_film
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
